<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>GigPulse</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <h1>⚡ GigPulse</h1>
            <span id="subscription-badge" class="badge">Завантаження…</span>
        </header>

        <nav class="tabs" aria-label="Розділи">
            <button type="button" class="tab active" data-tab="feed">Стрічка</button>
            <button type="button" class="tab" data-tab="favorites">Обране</button>
            <button type="button" class="tab" data-tab="filters">Фільтри</button>
            <button type="button" class="tab" data-tab="profile">Профіль</button>
        </nav>

        <section id="content-feed" class="tab-content">
            <form id="search-form" class="search-panel">
                <input id="search-input" type="search" placeholder="Пошук замовлень" aria-label="Пошук">
                <select id="category-select" aria-label="Категорія">
                    <option value="">Усі категорії</option>
                </select>
                <input id="min-budget-input" type="number" min="0" step="1" placeholder="Мін. бюджет" aria-label="Мінімальний бюджет">
                <button class="primary-button" type="submit">Знайти</button>
            </form>
            <div id="orders-list" class="cards" aria-live="polite"></div>
        </section>

        <section id="content-favorites" class="tab-content hidden">
            <div id="favorites-list" class="cards" aria-live="polite"></div>
        </section>

        <section id="content-filters" class="tab-content hidden">
            <p class="section-hint">Увімкніть категорії та задайте мінімальний бюджет або ключові слова для стрічки й сповіщень.</p>
            <div id="filters-list" class="cards"></div>
        </section>

        <section id="content-profile" class="tab-content hidden">
            <article id="profile-card" class="panel" aria-live="polite"></article>
        </section>
    </main>

    <dialog id="proposal-modal" class="modal">
        <form method="dialog" class="modal-content">
            <h2>🤖 AI-відгук</h2>
            <label for="user-skills">Ваші навички та досвід</label>
            <textarea id="user-skills" maxlength="2000" rows="4" placeholder="Наприклад: Python, FastAPI, 2 роки досвіду"></textarea>
            <p id="proposal-error" class="error-message hidden"></p>
            <div id="proposal-result" class="proposal-result hidden"></div>
            <div class="modal-actions">
                <button id="close-proposal" class="secondary-button" type="button">Закрити</button>
                <button id="generate-proposal" class="primary-button" type="button">Згенерувати</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="app.js"></script>
</body>
</html>
